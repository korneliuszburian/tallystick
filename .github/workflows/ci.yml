name: LEDGER CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: ledger-acceptance
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx --no-install tsc --noEmit

      - name: Implemented-module acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ledger
          npm run test:adapters
          npm run test:state
          npm run test:guards
          npm run test:e2e
          npm run demo

# Źródła wersji i konfiguracji:
# https://nodejs.org/en/blog/release/v24.20.0
# https://github.com/actions/checkout
# https://github.com/actions/setup-node
